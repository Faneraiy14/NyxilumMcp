name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    # Тести (test/smoke.mjs, test/transport.mjs) реально запускають
    # nyxilum_run/nyxilum_lint/... через СПРАВЖНІЙ NyxilumNode-бінарник,
    # не мокають його — тому потрібен зібраний NyxilumLang. NX_NODE_PATH
    # вказує на нього напряму, обходячи locate.js-евристику (та шукає
    # NyxilumEcosystem/... — структуру, якої в CI-чекауті нема).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NyxilumMcp
        uses: actions/checkout@v4
        with:
          path: NyxilumMcp

      - name: Checkout NyxilumLang (виконує тестований код)
        uses: actions/checkout@v4
        with:
          repository: Faneraiy14/NyxilumLang
          path: NyxilumLang

      - name: Checkout NyxilumDb (залежність NyxilumLang.csproj)
        uses: actions/checkout@v4
        with:
          repository: Faneraiy14/NyxilumDb
          path: NyxilumDb

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build NyxilumLang (net10.0)
        working-directory: NyxilumLang
        run: dotnet build src/NyxilumLang -f net10.0 -p:EnableWindowsTargeting=true --configuration Release

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm ci
        working-directory: NyxilumMcp
        run: npm ci

      - name: npm test
        working-directory: NyxilumMcp
        env:
          NX_NODE_PATH: ${{ github.workspace }}/NyxilumLang/src/NyxilumLang/bin/Release/net10.0/Nx
        run: npm test
