name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    # Тести (test/smoke.mjs, test/transport.mjs) реально запускають
    # arxlang_run/arxlang_lint/... через СПРАВЖНІЙ ArxNode-бінарник, не
    # мокають його — тому потрібен зібраний ArxLang. ARX_NODE_PATH
    # вказує на нього напряму, обходячи locate.js-евристику (та шукає
    # ArxEcosystem/... — структуру, якої в CI-чекауті нема).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ArxMcp
        uses: actions/checkout@v4
        with:
          path: ArxMcp

      - name: Checkout ArxLang (виконує тестований код)
        uses: actions/checkout@v4
        with:
          repository: Faneraiy14/ArxLang
          path: ArxLang

      - name: Checkout ArxDb (залежність ArxLang.csproj)
        uses: actions/checkout@v4
        with:
          repository: Faneraiy14/ArxDb
          path: ArxDb

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build ArxLang (net10.0)
        working-directory: ArxLang
        run: dotnet build src/ArxLang -f net10.0 -p:EnableWindowsTargeting=true --configuration Release

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm ci
        working-directory: ArxMcp
        run: npm ci

      - name: npm test
        working-directory: ArxMcp
        env:
          ARX_NODE_PATH: ${{ github.workspace }}/ArxLang/src/ArxLang/bin/Release/net10.0/ArxLang
        run: npm test
